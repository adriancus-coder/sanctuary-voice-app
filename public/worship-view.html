<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#050608">
  <title>Worship View — Sanctuary Voice</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/icon.svg">
</head>
<body class="worship-view-page">
  <main class="worship-view-main">
    <div class="worship-view-header">
      <span id="viewSongTitle" class="worship-view-title">—</span>
      <span id="viewVerseLabel" class="worship-view-verse">—</span>
    </div>
    <div id="viewLyrics" class="worship-view-lyrics">Conectare…</div>
    <div id="viewStatus" class="worship-view-status" role="status"></div>
  </main>

  <!-- V21.13: per-device font size control (no persistence). -->
  <div class="view-font-controls">
    <button id="viewFontDecrease" class="view-font-btn" type="button" aria-label="Text mai mic">A−</button>
    <button id="viewFontIncrease" class="view-font-btn" type="button" aria-label="Text mai mare">A+</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/worship-view.js"></script>
</body>
</html>
