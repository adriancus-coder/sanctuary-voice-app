<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141318">
  <title>Schimbă parola — Sanctuary Voice</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
</head>
<body>
  <main class="auth-shell">
    <form class="auth-card" id="pwForm" novalidate>
      <div class="eyebrow">Sanctuary Voice</div>
      <h1 class="auth-title">Schimbă parola</h1>
      <p class="auth-desc" id="pwIntro">Alege o parolă nouă (minim 10 caractere).</p>

      <label for="pwCurrent">Parola actuală</label>
      <input id="pwCurrent" type="password" autocomplete="current-password" required>

      <label for="pwNew">Parola nouă</label>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="10" required>

      <label for="pwConfirm">Confirmă parola nouă</label>
      <input id="pwConfirm" type="password" autocomplete="new-password" minlength="10" required>

      <div id="pwError" class="auth-error" role="alert"></div>

      <button type="submit" class="btn btn-primary btn-full" id="pwSubmit">Salvează parola</button>
    </form>
  </main>
  <script src="/change-password.js"></script>
</body>
</html>
