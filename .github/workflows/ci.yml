name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check (syntax, lint, i18n, smoke) + health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high+)
        run: npm run audit:high || true

      - name: Check (syntax + lint + i18n parity + boot smoke)
        run: npm run check

      - name: Health endpoint responds
        run: |
          DATA_DIR=$(mktemp -d) LOG_DIR=$(mktemp -d) PORT=3931 \
            MASTER_ADMIN_PIN=ci ADMIN_SESSION_SECRET=ci-secret \
            node server.js & SVPID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3931/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          kill $SVPID 2>/dev/null || true
